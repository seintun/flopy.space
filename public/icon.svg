<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <!-- Neon Outer Ring -->
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Character Body Gradient -->
    <linearGradient id="bodyGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#ff9f1c"/>
      <stop offset="100%" stop-color="#e05780"/>
    </linearGradient>

    <!-- Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbf3f0"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  
  <!-- Outer Neon Halo Ring -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#neonRing)" stroke-width="8" opacity="0.85" filter="url(#glow)"/>

  <!-- Left Wing -->
  <g transform="translate(130, 270) rotate(-25)">
    <ellipse cx="0" cy="0" rx="65" ry="26" fill="url(#wingGrad)" opacity="0.95"/>
    <ellipse cx="10" cy="-4" rx="45" ry="16" fill="#ffffff"/>
  </g>

  <!-- Right Wing -->
  <g transform="translate(382, 270) rotate(25)">
    <ellipse cx="0" cy="0" rx="65" ry="26" fill="url(#wingGrad)" opacity="0.95"/>
    <ellipse cx="-10" cy="-4" rx="45" ry="16" fill="#ffffff"/>
  </g>

  <!-- Mascot Ears -->
  <polygon points="175,130 235,220 140,205" fill="#ff9f1c"/>
  <polygon points="180,150 220,210 155,200" fill="#ffb4a2"/>
  <polygon points="337,130 277,220 372,205" fill="#ff9f1c"/>
  <polygon points="332,150 292,210 357,200" fill="#ffb4a2"/>

  <!-- Mascot Round Body -->
  <circle cx="256" cy="275" r="125" fill="url(#bodyGrad)" filter="url(#glow)"/>
  
  <!-- Belly -->
  <circle cx="256" cy="310" r="82" fill="#fff9f0"/>

  <!-- Eyes with Sparkles -->
  <ellipse cx="205" cy="255" rx="22" ry="28" fill="#0f172a"/>
  <circle cx="212" cy="245" r="8" fill="#ffffff"/>
  <circle cx="198" cy="268" r="4" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="307" cy="255" rx="22" ry="28" fill="#0f172a"/>
  <circle cx="314" cy="245" r="8" fill="#ffffff"/>
  <circle cx="300" cy="268" r="4" fill="#ffffff"/>

  <!-- Cheeks -->
  <ellipse cx="185" cy="295" rx="16" ry="10" fill="#ff8da1" opacity="0.75"/>
  <ellipse cx="327" cy="295" rx="16" ry="10" fill="#ff8da1" opacity="0.75"/>

  <!-- Cute Nose & Smile -->
  <polygon points="256,285 248,276 264,276" fill="#ff4d6d"/>
  <path d="M 244,295 Q 256,305 268,295" fill="none" stroke="#e05780" stroke-width="4" stroke-linecap="round"/>

  <!-- Floating Sparkles / Time Stardust -->
  <polygon points="256,85 262,97 274,103 262,109 256,121 250,109 238,103 250,97" fill="#00f5d4"/>
  <polygon points="100,200 104,208 112,212 104,216 100,224 96,216 88,212 96,208" fill="#ffd166"/>
  <polygon points="412,180 416,188 424,192 416,196 412,204 408,196 400,192 408,188" fill="#00e5ff"/>
</svg>
